# Despliegue en Render (plan gratuito). En Render: New > Blueprint > elegir este repositorio.
# La URL de la base la inyecta Render; no hay secretos en el repositorio.
databases:
  - name: tecnostock-db
    plan: free
    databaseName: tecnostock
    user: tecnostock
    ipAllowList: []            # sólo accesible desde la red privada de Render

services:
  - type: web
    name: tecnostock
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tecnostock-db
          property: connectionString
      - key: SEED_DATA
        value: "1"
      - key: RESET_TOKEN          # clave para restaurar los datos de demostración
        generateValue: true
