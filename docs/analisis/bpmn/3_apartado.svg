<text transform="translate(24.0 571.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#eef7f4">SISTEMA</text>
<text transform="translate(44.0 571.0) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#eef7f4">AUTOMÁTICO</text>
