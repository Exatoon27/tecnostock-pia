<rect x="113.0" y="148.0" width="196" height="58" rx="29.0" fill="#e3f4ea" stroke="#1f7a3d" stroke-width="2"/>
<text text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700"><tspan x="211" y="177">Quiere apartar</tspan></text>
<rect x="383.0" y="331.0" width="196" height="72" rx="9" fill="#ffffff" stroke="#0c3a33" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="481" y="348">Registrar los datos del</tspan><tspan x="481" y="367">cliente y el anticipo</tspan><tspan x="481" y="386">(mínimo 20 %)</tspan></text>
<rect x="653.0" y="521.0" width="196" height="72" rx="9" fill="#ffffff" stroke="#0c3a33" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="751" y="548">Reservar la pieza en el</tspan><tspan x="751" y="566">stock de inmediato</tspan></text>
<line x1="751" y1="593.0" x2="751" y2="607.0" stroke="#5b6965" stroke-dasharray="4 3"/>
<path d="M665 607.0 h160 l12 12 v36 h-172z" fill="#ffffff" stroke="#5b6965"/>
<text text-anchor="middle" dominant-baseline="central" font-size="13"><tspan x="751" y="627">Comprobante de apartado</tspan></text>
<polygon points="1021,501.0 1128.0,557.0 1021,613.0 914.0,557.0" fill="#fdf3d0" stroke="#8a6d1a" stroke-width="1.8"/>
<text text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1021" y="538">¿Liquida el</tspan><tspan x="1021" y="557">saldo en 30</tspan><tspan x="1021" y="576">días o menos?</tspan></text>
<rect x="1193.0" y="331.0" width="196" height="72" rx="9" fill="#ffffff" stroke="#0c3a33" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1291" y="348">Registrar el pago del</tspan><tspan x="1291" y="367">saldo, escanear la</tspan><tspan x="1291" y="386">serie y entregar</tspan></text>
<rect x="1301.0" y="521.0" width="196" height="72" rx="9" fill="#ffffff" stroke="#0c3a33" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1399" y="538">Liberar la pieza y</tspan><tspan x="1399" y="557">aplicar penalización</tspan><tspan x="1399" y="576">del 10 %</tspan></text>
<rect x="1517.0" y="148.0" width="196" height="58" rx="29.0" fill="#fbe3df" stroke="#a63a2b" stroke-width="4"/>
<text text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700"><tspan x="1615" y="168">Apartado liquidado y</tspan><tspan x="1615" y="186">entregado</tspan></text>
<rect x="1841.0" y="148.0" width="196" height="58" rx="29.0" fill="#fbe3df" stroke="#a63a2b" stroke-width="4"/>
<text text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700"><tspan x="1939" y="168">Apartado cancelado por</tspan><tspan x="1939" y="186">vencimiento</tspan></text>
<text x="1031" y="491" font-size="15" font-weight="700" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5">Sí</text>
<text x="1140" y="547" font-size="15" font-weight="700" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5">No (día 31)</text>
<rect x="24" y="702" width="34" height="18" rx="9" fill="#e3f4ea" stroke="#1f7a3d" stroke-width="2"/><text x="66" y="716" font-size="14" fill="#5b6965">Inicio</text><rect x="140" y="702" width="34" height="18" rx="4" fill="#ffffff" stroke="#0c3a33" stroke-width="1.6"/><text x="182" y="716" font-size="14" fill="#5b6965">Actividad</text><rect x="280" y="702" width="34" height="18" rx="4" fill="#fdf3d0" stroke="#8a6d1a" stroke-width="1.8"/><text x="322" y="716" font-size="14" fill="#5b6965">Decisión</text><rect x="412" y="702" width="34" height="18" rx="9" fill="#fbe3df" stroke="#a63a2b" stroke-width="2"/><text x="454" y="716" font-size="14" fill="#5b6965">Fin</text><rect x="504" y="702" width="34" height="18" rx="4" fill="#e0edfb" stroke="#1d5fa8" stroke-width="1.8"/><text x="546" y="716" font-size="14" fill="#5b6965">Pasa a otro proceso</text>
</svg>