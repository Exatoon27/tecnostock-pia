<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="38" font-size="26" font-weight="700">Proceso 3 · Apartado de un producto</text>
<text x="24" y="66" font-size="16" fill="#5b6965">Anticipo mínimo del 20 % y 30 días para liquidar. Origen: BPMN de U2.</text>
<rect x="0" y="96" width="2169" height="190" fill="#f3f6f4" stroke="#9fb0aa"/>
<rect x="0" y="96" width="64" height="190" fill="#0c3a33"/>
